[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerscope"
version = "0.1.0"
description = "SQL-native portfolio risk analytics engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LedgerScope Contributors" }
]
keywords = ["portfolio", "analytics", "risk", "duckdb", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "duckdb>=0.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "yfinance>=0.2",
    "requests-cache>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "weasyprint>=62",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "urllib3>=2.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
ledgerscope = "ledgerscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
